name: 个人分支回归

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'mxgnene01/botmux'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      BOTMUX_NO_CLAIM: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4
      - name: 准备私有终端测试工具
        shell: bash
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update && sudo apt-get install -y tmux
            else
              brew install tmux
            fi
          fi
      - name: 安装冻结依赖
        run: bun install --frozen-lockfile
      - name: 验证个人维护的输入与归属链路
        shell: bash
        run: |
          files=(
            test/traex-terminal-session.test.ts
            test/tmux-pipe-input-snapshot.test.ts
            test/tmux-pipe-backend.test.ts
            test/traex-adopt-native-command-gate.test.ts
            test/traex-adapter-submit.test.ts
            test/traex-shared-adopt-flow.test.ts
            test/traex-adopt-rotation.test.ts
            test/traex-transcript.test.ts
            test/codex-terminal-session.test.ts
            test/session-discovery.test.ts
            test/traex-auto-model-idle-admission.test.ts
            test/submit-provisional-attribution.test.ts
          )
          shopt -s nullglob
          files+=(test/traex-native-resume*.test.ts)
          perl -e 'alarm shift; exec @ARGV' 300 bun run test -- --project unit "${files[@]}"
      - name: 构建源码
        run: bun run build
      - name: 构建本机架构候选
        env:
          BOTMUX_VERIFY_BAKED_VERSION: 3.59.35-fork.${{ github.run_number }}
        run: bun scripts/build-bun-binary.mjs --out out/botmux-fork
      - name: 验证独立二进制启动
        run: bun scripts/fenced-run.ts -- node scripts/smoke-bun-binary.mjs out/botmux-fork

# 只验证候选：不上传长期存储制品、不发布 npm/GitHub Release、不部署或认领真实运行入口
